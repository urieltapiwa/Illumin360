# Illumin360 — application services overlay (build + run the .NET apps in the local environment).
# Run the full topology:
#   docker compose -f deploy/docker/docker-compose.yml \
#                  -f deploy/observability/docker-compose.observability.yml \
#                  -f deploy/docker/docker-compose.apps.yml up -d --build
# Build context is the repo root so Dockerfiles can copy Directory.*.props + src/.
name: illumin360

services:
  candidates-api:
    build:
      context: ../..
      dockerfile: src/Services/Candidates/Illumin360.Candidates.Api/Dockerfile
    container_name: illumin360-candidates-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__candidates: "Host=postgres;Port=5432;Database=illumin360_candidates;Username=${POSTGRES_USER:-illumin};Password=${POSTGRES_PASSWORD:-illumin_dev_pw}"
      ConnectionStrings__rabbitmq: "amqp://${RABBITMQ_USER:-illumin}:${RABBITMQ_PASSWORD:-illumin}@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4317"
    expose: ["8080"]
    ports: ["5201:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    # No container HEALTHCHECK: the chiseled runtime has no shell for a CMD-SHELL probe (it reported a false
    # "unhealthy"). Liveness/readiness are exposed over HTTP at /health/live and /health/ready and consumed by
    # the gateway's active health checks and Kubernetes probes.
    networks: [illumin360]

  recruitment-api:
    build:
      context: ../..
      dockerfile: src/Services/Recruitment/Illumin360.Recruitment.Api/Dockerfile
    container_name: illumin360-recruitment-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__recruitment: "Host=postgres;Port=5432;Database=illumin360_recruitment;Username=${POSTGRES_USER:-illumin};Password=${POSTGRES_PASSWORD:-illumin_dev_pw}"
      ConnectionStrings__rabbitmq: "amqp://${RABBITMQ_USER:-illumin}:${RABBITMQ_PASSWORD:-illumin}@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4317"
    expose: ["8080"]
    ports: ["5202:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    # No container HEALTHCHECK: the chiseled runtime has no shell for a CMD-SHELL probe (it reported a false
    # "unhealthy"). Liveness/readiness are exposed over HTTP at /health/live and /health/ready and consumed by
    # the gateway's active health checks and Kubernetes probes.
    networks: [illumin360]

  students-api:

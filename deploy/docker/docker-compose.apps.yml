    expose: ["8080"]
    ports: ["5203:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    # No container HEALTHCHECK: the chiseled runtime has no shell for a CMD-SHELL probe (it reported a false

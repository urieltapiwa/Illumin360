  # Dev mail catcher for the self-registration email-verification flow (SMTP in, web UI + API on 8025).
  # The illumin360 realm's SMTP is pointed here; verification emails are caught, not delivered externally.
  mailpit:
    image: axllent/mailpit:latest
    container_name: illumin360-mailpit
    restart: unless-stopped
    ports: ["8025:8025", "1025:1025"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    networks: [illumin360]

  notifications-worker:
    build:
      context: ../..
      dockerfile: src/Services/Notifications/Illumin360.Notifications.Worker/Dockerfile
    container_name: illumin360-notifications-worker
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__rabbitmq: "amqp://${RABBITMQ_USER:-illumin}:${RABBITMQ_PASSWORD:-illumin}@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4317"
    expose: ["8080"]
    ports: ["5301:8080"]
    depends_on:
      rabbitmq: { condition: service_healthy }
    # No container HEALTHCHECK: the chiseled runtime has no shell for a CMD-SHELL probe (it reported a false
    # "unhealthy"). Liveness/readiness are exposed over HTTP at /health/live and /health/ready and consumed by
    # the gateway's active health checks and Kubernetes probes.
    networks: [illumin360]

  gateway:
    build:
      context: ../..
      dockerfile: src/Gateway/Dockerfile
    container_name: illumin360-gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4317"
    ports: ["8088:8080"]
    depends_on: [candidates-api, recruitment-api, students-api, professionals-api, admin-api, employers-api]
    networks: [illumin360]

  # Business portal SPA — static build served by nginx, fronted by the BFF (never exposed directly).
  web:
    build:
      context: ../../web/business-portal
      dockerfile: Dockerfile
      args:
        VITE_USE_BFF: "1"
    container_name: illumin360-business-web
    restart: unless-stopped
    expose: ["80"]
    networks: [illumin360]

  # Business BFF — server-side OIDC + cookie session + token relay; serves the SPA same-origin.
  # Keycloak hostname alignment: the BFF reaches the shared dev Keycloak by its in-network name
  # (Oidc__Authority = keycloak:8080) for discovery, token exchange, user-info and issuer validation, so the
  # token `iss` matches Authority. The browser can't resolve `keycloak`, so the authorize/end-session redirects
  # are rewritten to Oidc__FrontChannelAuthority (localhost:8080, the published KC port) in-app. This keeps the
  # shared Keycloak on per-request issuer derivation (no fixed KC_HOSTNAME) so the sibling apps still validate.
  # The realm client's redirect URIs must include this BFF's external URL (http://localhost:5180/bff/...).
  bff-business:
    build:
      context: ../..
      dockerfile: src/BFF/Illumin360.Bff.Business/Dockerfile
    container_name: illumin360-bff-business
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Oidc__Authority: "http://keycloak:8080/realms/illumin360"
      Oidc__FrontChannelAuthority: "http://localhost:8080/realms/illumin360"
      Oidc__ClientId: "illumin360-business-bff"
      Oidc__ClientSecret: "${BFF_CLIENT_SECRET:-bff-dev-secret-local-only}"
      Oidc__RequireHttps: "false"
      ReverseProxy__Clusters__gateway__Destinations__d1__Address: "http://gateway:8080/"
      ReverseProxy__Clusters__spa__Destinations__d1__Address: "http://web:80/"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4317"
    ports: ["5180:8080"]
    depends_on: [web, gateway]
    networks: [illumin360]

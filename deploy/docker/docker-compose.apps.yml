    networks: [illumin360]

  gateway:
    build:
      context: ../..
      dockerfile: src/Gateway/Dockerfile
    container_name: illumin360-gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4317"
    ports: ["8088:8080"]
    depends_on: [candidates-api, recruitment-api, students-api, professionals-api, admin-api, employers-api, payments-api, billing-api]
    networks: [illumin360]

  # Business portal SPA — static build served by nginx, fronted by the BFF (never exposed directly).
  # Landing hub for portal.illumin — static nginx serving links to the six MVC portals.
  # Replaces the retired business-portal SPA (`web`) + `bff-business`.
  portal:
    build:
      context: ../../web/portal-hub
      dockerfile: Dockerfile
    container_name: illumin360-portal
    restart: unless-stopped
    expose: ["80"]
    networks: [illumin360]

  # ---------------------------------------------------------------------------------------------------
  # MVC portal web apps (HopeUI). Each reaches Keycloak in-network as keycloak:8080 for discovery/token
  # exchange; browser redirects are rewritten to Oidc__FrontChannelAuthority (localhost:8080). Published
  # on the same host ports as local 'dotnet run' so the realm clients' registered :519x/signin-oidc
  # redirect URIs keep working unchanged. API calls go to the gateway in-network (Gateway__BaseAddress).
  # ---------------------------------------------------------------------------------------------------
  admin-web:
    build:
      context: ../..
      dockerfile: src/Web/Illumin360.AdminWeb/Dockerfile
    container_name: illumin360-admin-webapp
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Oidc__Authority: "http://keycloak:8080/realms/admin"
      Oidc__FrontChannelAuthority: "http://localhost:8080/realms/admin"
      Oidc__ClientId: "admin-web"
      Oidc__ClientSecret: "${ADMIN_WEB_CLIENT_SECRET:-CHANGE_ME_admin_dev_secret}"
      Oidc__RequireHttps: "false"
      Gateway__BaseAddress: "http://gateway:8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4317"
    ports: ["5192:8080"]
    depends_on: [gateway]
    networks: [illumin360]

  business-web:

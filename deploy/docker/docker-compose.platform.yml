# ─────────────────────────────────────────────────────────────────────────
# Illumin360 — platform OVERLAY (Hetzner, plan A′, runs on the CAX41).
#
# Merge ON TOP of the existing base + apps composes:
#   docker compose \
#     -f deploy/docker/docker-compose.yml \
#     -f deploy/docker/docker-compose.apps.yml \
#     -f deploy/docker/docker-compose.platform.yml \
#     --env-file deploy/docker/.env up -d --build
#
# What this overlay changes (and ONLY this):
#   • Observability is REMOVED for the single 8 GB host — Illumin's own LGTM
#     compose is not included, and the apps' baked OTEL endpoint (alloy:4317)
#     simply has no collector to reach (harmless; the exporter drops silently).
#   • The 6 MVC portals + the gateway join `edge` and get Traefik routers at
#     <x>.illumin.${BASE_DOMAIN}.
#   • The split-issuer hack (keycloak:8080 in-network + localhost:8080 front)
#     is replaced by ONE public issuer https://id.${BASE_DOMAIN}/realms/<realm>.
#     With a real HTTPS Keycloak, browser and server use the same issuer, so
#     token `iss` matches Authority — no front-channel rewrite needed.
#
# NOTE: Illumin's own postgres/redis/rabbitmq/minio (base compose) stay as the
# app's private infra. Its bundled mailpit (apps compose) can be left running
# or dropped; realm SMTP can instead point at the shared mailpit:1025.
# ─────────────────────────────────────────────────────────────────────────

networks:
  illumin360: { external: true }
  edge:       { external: true }

services:
  # ── Backend APIs + worker: no shared monitoring net (removed, see header) ──
  candidates-api:    { networks: [illumin360], environment: { Oidc__BackChannelBase: "https://id.${BASE_DOMAIN}", Oidc__FrontChannelBase: "https://id.${BASE_DOMAIN}" } }
  recruitment-api:   { networks: [illumin360], environment: { Oidc__BackChannelBase: "https://id.${BASE_DOMAIN}", Oidc__FrontChannelBase: "https://id.${BASE_DOMAIN}" } }
  students-api:      { networks: [illumin360], environment: { Oidc__BackChannelBase: "https://id.${BASE_DOMAIN}", Oidc__FrontChannelBase: "https://id.${BASE_DOMAIN}" } }
  professionals-api: { networks: [illumin360], environment: { Oidc__BackChannelBase: "https://id.${BASE_DOMAIN}", Oidc__FrontChannelBase: "https://id.${BASE_DOMAIN}" } }
  admin-api:         { networks: [illumin360], environment: { Oidc__BackChannelBase: "https://id.${BASE_DOMAIN}", Oidc__FrontChannelBase: "https://id.${BASE_DOMAIN}" } }
  employers-api:     { networks: [illumin360], environment: { Oidc__BackChannelBase: "https://id.${BASE_DOMAIN}", Oidc__FrontChannelBase: "https://id.${BASE_DOMAIN}" } }
  payments-api:      { networks: [illumin360], environment: { Oidc__BackChannelBase: "https://id.${BASE_DOMAIN}", Oidc__FrontChannelBase: "https://id.${BASE_DOMAIN}" } }
  billing-api:       { networks: [illumin360], environment: { Oidc__BackChannelBase: "https://id.${BASE_DOMAIN}", Oidc__FrontChannelBase: "https://id.${BASE_DOMAIN}" } }
  notifications-worker: { networks: [illumin360] }

  # ── Gateway: exposed for direct API testing with bearer tokens ────────────
  gateway:
    networks: [illumin360, edge]
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.illumin-gw.rule=Host(`api.illumin.${BASE_DOMAIN}`)
      - traefik.http.routers.illumin-gw.entrypoints=websecure
      - traefik.http.routers.illumin-gw.tls.certresolver=le
      - traefik.http.services.illumin-gw.loadbalancer.server.port=8080

  # ── Landing hub (static nginx, no auth) — replaces the retired
  # business-portal SPA + bff-business. ──────────────────────────────────────
  portal:
    networks: [illumin360, edge]
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.illumin-portal.rule=Host(`portal.illumin.${BASE_DOMAIN}`)
      - traefik.http.routers.illumin-portal.entrypoints=websecure
      - traefik.http.routers.illumin-portal.tls.certresolver=le
      - traefik.http.services.illumin-portal.loadbalancer.server.port=80

  # ── MVC portals: one public issuer + Registration base -> shared KC ───────
  admin-web:
    environment:
      Oidc__Authority: "https://id.${BASE_DOMAIN}/realms/admin"
      Oidc__FrontChannelAuthority: "https://id.${BASE_DOMAIN}/realms/admin"
      Oidc__RequireHttps: "true"
      # Honour Traefik's X-Forwarded-Proto so the app builds https redirect_uris
      # (otherwise it sends http:// and Keycloak rejects "Invalid redirect_uri").
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    networks: [illumin360, edge]
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.illumin-admin.rule=Host(`admin.illumin.${BASE_DOMAIN}`)
      - traefik.http.routers.illumin-admin.entrypoints=websecure
      - traefik.http.routers.illumin-admin.tls.certresolver=le
      - traefik.http.services.illumin-admin.loadbalancer.server.port=8080

  business-web:
    environment:
      Oidc__Authority: "https://id.${BASE_DOMAIN}/realms/business"
      Oidc__FrontChannelAuthority: "https://id.${BASE_DOMAIN}/realms/business"
      Oidc__RequireHttps: "true"
      # Honour Traefik's X-Forwarded-Proto so the app builds https redirect_uris

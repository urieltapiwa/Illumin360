server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the content-hashed build assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must always be revalidated: it references the content-hashed assets, so a stale copy
    # would point at asset filenames that no longer exist after a redeploy (→ SPA fallback loop). no-cache
    # lets the browser keep a copy but forces a conditional revalidation (ETag) on every load.
    # This location also matches the internal /index.html served by the SPA fallback below.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA history fallback — unknown paths serve index.html for client-side routing.
    # Note: /api and /bff are served by the BFF that fronts this container, never by nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
